[project]
name = "invoice-extractor"
version = "2.0.0"
description = "Invoice extraction and validation system for multiple advertising platforms"
requires-python = ">=3.9"
readme = "README.md"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
license = {text = "MIT"}

dependencies = [
    "pandas>=2.0.0",
    "google-cloud-bigquery>=3.0.0",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "google-api-python-client>=2.0.0",
    "google-auth>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    "python-dotenv>=1.0.0",
    "pdf2image>=1.16.0",
    "pdfplumber>=0.10.0",
    "requests>=2.31.0",
    "tenacity>=8.2.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
gemini = [
    "google-generativeai>=0.3.0",
]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[project.scripts]
extract = "invoice_extractor.extractor.main_extract:main"
validate = "invoice_extractor.validators.validate:main"
